
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Bag | GUرOOR</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#f5f5f5;color:#111}
header{height:72px;background:#050505;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 6%}
.logo{font-size:25px;font-weight:900}
.logo span{color:#888}
.header-button{border:1px solid #555;background:transparent;color:white;padding:10px 14px;text-decoration:none;font-size:12px}
.container{max-width:1100px;margin:auto;padding:35px 6% 70px}
.back{display:inline-block;background:#000;color:#fff;text-decoration:none;padding:12px 18px;font-size:12px;font-weight:bold;margin-bottom:30px}
h1{font-size:42px;font-weight:900;margin-bottom:25px}
.cart-layout{display:grid;grid-template-columns:1.4fr .8fr;gap:30px}
.cart-items,.summary,.checkout{background:#fff;padding:22px;border:1px solid #ddd}
.cart-item{display:grid;grid-template-columns:110px 1fr;gap:18px;padding:18px 0;border-bottom:1px solid #eee}
.cart-item img{width:110px;height:125px;object-fit:cover;background:#eee}
.item-name{font-size:18px;font-weight:900;text-transform:uppercase;margin-bottom:8px}
.item-meta{font-size:13px;color:#666;line-height:1.8}
.item-price{font-weight:900;margin-top:8px}
.quantity{display:flex;align-items:center;gap:12px;margin-top:12px}
.quantity button,.remove{border:1px solid #ccc;background:white;padding:7px 12px;cursor:pointer}
.remove{margin-top:10px;color:#b00020;font-size:11px}
.summary h2,.checkout h2{font-size:19px;margin-bottom:20px}
.summary-line{display:flex;justify-content:space-between;margin:14px 0;font-size:14px}
.total{font-size:20px;font-weight:900;border-top:1px solid #ddd;padding-top:16px;margin-top:16px}
.checkout{margin-top:20px}
.checkout label{display:block;font-size:11px;font-weight:bold;margin:15px 0 7px}
.checkout input,.checkout textarea{width:100%;padding:12px;border:1px solid #ccc;font:14px Arial}
.checkout textarea{height:85px;resize:vertical}
.primary{width:100%;padding:16px;background:#050505;color:white;border:0;font-weight:900;letter-spacing:1px;cursor:pointer;margin-top:18px}
.primary:disabled{background:#888;cursor:not-allowed}
.empty{text-align:center;padding:55px 15px}
.empty h2{font-size:25px;margin-bottom:12px}
.empty p{color:#666;margin-bottom:20px}
.message{font-size:13px;color:#b00020;margin-top:12px}
@media(max-width:750px){
.container{padding:22px 15px 50px}
.cart-layout{grid-template-columns:1fr}
h1{font-size:34px}
}
</style>
</head>

<body>

<header>
  <div class="logo">GU<span>ر</span>OOR</div>
  <a href="index.html" class="header-button">CONTINUE SHOPPING</a>
</header>

<main class="container">
  <a href="index.html#shop" class="back">← BACK TO SHOP</a>
  <h1>YOUR BAG</h1>

  <div id="cart-content"></div>
</main>

<script>
const CART_KEY = "streetwear_cart";
const WHATSAPP_NUMBER = "918928057608";

function getCart(){
  try{
    const cart = JSON.parse(localStorage.getItem(CART_KEY));
    return Array.isArray(cart) ? cart : [];
  }catch(error){
    return [];
  }
}

function saveCart(cart){
  localStorage.setItem(CART_KEY, JSON.stringify(cart));
  renderCart();
}

function money(value){
  return "₹" + Number(value || 0).toLocaleString("en-IN");
}

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, function(char){
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[char];
  });
}

function renderCart(){
  const cart = getCart();
  const container = document.getElementById("cart-content");

  if(cart.length === 0){
    container.innerHTML = `
      <div class="empty">
        <h2>Your bag is empty.</h2>
        <p>Looks like you haven't added anything yet.</p>
        <a href="index.html#shop" class="back">START SHOPPING</a>
      </div>
    `;
    return;
  }

  let subtotal = 0;

  const itemsHTML = cart.map((item,index) => {
    const price = Number(item.price || 0);
    const quantity = Math.max(1, Number(item.quantity || 1));
    subtotal += price * quantity;

    const image = item.image
      ? `<img src="${escapeHTML(item.image)}" alt="${escapeHTML(item.name)}">`
      : `<div style="width:110px;height:125px;background:#eee"></div>`;

    return `
      <div class="cart-item">
        ${image}
        <div>
          <div class="item-name">${escapeHTML(item.name)}</div>
          <div class="item-meta">
            Color: ${escapeHTML(item.color)}<br>
            Size: ${escapeHTML(item.size)}
          </div>
          <div class="item-price">${money(price)}</div>

          <div class="quantity">
            <button onclick="changeQuantity(${index},-1)">−</button>
            <strong>${quantity}</strong>
            <button onclick="changeQuantity(${index},1)">+</button>
          </div>

          <button class="remove" onclick="removeItem(${index})">REMOVE</button>
        </div>
      </div>
    `;
  }).join("");

  container.innerHTML = `
    <div class="cart-layout">
      <section class="cart-items">
        ${itemsHTML}
      </section>

      <div>
        <section class="summary">
          <h2>ORDER SUMMARY</h2>
          <div class="summary-line">
            <span>Subtotal</span>
            <strong>${money(subtotal)}</strong>
          </div>
          <div class="summary-line">
            <span>Delivery</span>
            <span>To be confirmed</span>
          </div>
          <div class="summary-line total">
            <span>Total</span>
            <span>${money(subtotal)}</span>
          </div>
        </section>

        <section class="checkout">
          <h2>DELIVERY DETAILS</h2>

          <form id="checkout-form">
            <label for="customer-name">FULL NAME *</label>
            <input id="customer-name" required placeholder="Your name">

            

<label for="customer-phone">PHONE NUMBER *</label>
<input
  id="customer-phone"
  type="tel"
  required
  inputmode="numeric"
  pattern="[6-9][0-9]{9}"
  maxlength="10"
  placeholder="10-digit mobile number"
>

<label for="customer-address">FULL ADDRESS *</label>
<textarea id="customer-address" required
  placeholder="House number, building, street, area"></textarea>


            <label for="customer-pincode">PINCODE *</label>
            <input id="customer-pincode" required
              pattern="[0-9]{6}" maxlength="6" placeholder="6-digit pincode">

            <p id="checkout-message" class="message"></p>

            <button type="submit" class="primary">
              PLACE ORDER ON WHATSAPP
            </button>
          </form>
        </section>
      </div>
    </div>
  `;

  document.getElementById("checkout-form").addEventListener("submit", placeOrder);
  const phoneInput = document.getElementById("customer-phone");

phoneInput.addEventListener("input", function () {
  phoneInput.value = phoneInput.value.replace(/\D/g, "").slice(0, 10);

  const message = document.getElementById("checkout-message");

  if (phoneInput.value.length > 0 && !/^[6-9][0-9]{9}$/.test(phoneInput.value)) {
    message.textContent = "Please enter a valid 10-digit Indian mobile number.";
  } else {
    message.textContent = "";
  }
});
}

function changeQuantity(index,change){
  const cart = getCart();
  if(!cart[index]) return;

  const newQuantity = Number(cart[index].quantity || 1) + change;

  if(newQuantity < 1) return;

  cart[index].quantity = newQuantity;
  saveCart(cart);
}

function removeItem(index){
  const cart = getCart();
  cart.splice(index,1);
  saveCart(cart);
}

function placeOrder(event){
  event.preventDefault();

  const cart = getCart();
  if(cart.length === 0) return;

  const name = document.getElementById("customer-name").value.trim();
  const phone = document.getElementById("customer-phone").value.trim();
  const address = document.getElementById("customer-address").value.trim();
  const pincode = document.getElementById("customer-pincode").value.trim();

  const message = document.getElementById("checkout-message");

  
if(!/^[6-9][0-9]{9}$/.test(phone)){
  message.textContent = "⚠ Please enter a valid 10-digit Indian mobile number.";
  document.getElementById("customer-phone").focus();
  return;
}


  if(!/^[0-9]{6}$/.test(pincode)){
    message.textContent = "Enter a valid 6-digit pincode.";
    return;
  }

  let total = 0;

  let orderText = "Hello GUرOOR! I want to place an order.\n\n";
  orderText += "CUSTOMER DETAILS\n";
  orderText += "Name: " + name + "\n";
  orderText += "Phone: " + phone + "\n";
  orderText += "Address: " + address + "\n";
  orderText += "Pincode: " + pincode + "\n\n";
  orderText += "ORDER ITEMS\n";

  cart.forEach((item,index) => {
    const price = Number(item.price || 0);
    const quantity = Number(item.quantity || 1);
    const lineTotal = price * quantity;
    total += lineTotal;

    orderText += (index + 1) + ". " + item.name + "\n";
    orderText += "Color: " + item.color + "\n";
    orderText += "Size: " + item.size + "\n";
    orderText += "Quantity: " + quantity + "\n";
    orderText += "Price: " + money(lineTotal) + "\n\n";
  });

  orderText += "Subtotal: " + money(total) + "\n";
  orderText += "Delivery charges: To be confirmed\n";
  orderText += "\nPlease confirm availability and delivery charges.";

  const whatsappURL =
    "https://wa.me/" + WHATSAPP_NUMBER +
    "?text=" + encodeURIComponent(orderText);

  window.open(whatsappURL,"_blank");
}

renderCart();
</script>

</body>
</html>
